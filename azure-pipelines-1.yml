trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
    clean: true

  - task: NodeTool@0
    displayName: 'Set up Node.js 24'
    inputs:
      versionSpec: '24.x'

  - bash: |
      set -euo pipefail
      node --version
      npm --version

      npm install --package-lock-only
      git diff --stat -- package-lock.json
      npm ci
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: 'Repair and verify npm lockfile on Linux'

  - publish: '$(Build.SourcesDirectory)/package-lock.json'
    artifact: repaired-lockfile
    displayName: 'Publish verified lockfile'

  - bash: |
      set -euo pipefail
      npm run build
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: 'Build Ionic Angular application'

  - bash: |
      set -euo pipefail
      if ! command -v php >/dev/null 2>&1; then
        sudo apt-get update
        sudo apt-get install -y php-cli
      fi

      php --version
      find backend -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: 'Check PHP syntax'

  - publish: '$(Build.SourcesDirectory)/www'
    artifact: selectcutz-web
    displayName: 'Publish web build'